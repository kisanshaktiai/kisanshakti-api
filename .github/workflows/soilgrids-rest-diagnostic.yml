name: SoilGrids official endpoint diagnostic
on:
  push:
    branches:
      - soil-ingestion-hardened-20261115
    paths:
      - soil_ingestion/tests/live_soilgrids_diagnostic.py
      - .github/workflows/soilgrids-rest-diagnostic.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r soil_ingestion/requirements.txt
      - run: python -m soil_ingestion.tests.live_soilgrids_diagnostic
